name: Auto Tests Docker

on:
  workflow_dispatch:
    inputs:
      frontendZipUrl:
        description: 'Frontend zip url'
        required: true
        type: string
        default: 'latest'
      testSuites:
        description: 'Test suites to run. isolated also needs RUN_DESTRUCTIVE_TESTS=true in the env secret.'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - graphql
          - restapi
          - e2e
          - e2e-frontend
          - e2e-backend
          - isolated
      grep:
        description: 'Optional Playwright --grep pattern. Leave empty to run everything.'
        required: false
        type: string
        default: ''
      workers:
        description: 'Optional Playwright --workers value (e.g. 4 or 50%). Leave empty for the config default.'
        required: false
        type: string
        default: ''

jobs:
  e2e-tests:
    uses: VirtoCommerce/.github/.github/workflows/playwright-tests.yml@v3.1000.3
    with:
      installModules: 'false'
      installCustomModule: 'false'
      vctestingRepoBranch: '${{ github.ref_name }}'
      frontendZipUrl: '${{ inputs.frontendZipUrl }}'
      customPackagesJsonUrl: 'https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/backend-packages.json'
      testSuites: ${{ inputs.testSuites == 'all' && 'graphql,restapi,e2e' || inputs.testSuites }}
      grep: ${{ inputs.grep }}
      workers: ${{ inputs.workers }}
    secrets:
      envPAT: ${{ secrets.REPO_TOKEN }}
      testSecretEnvFile: ${{ secrets.VC_TESTING_MODULE_ENV_FILE_NEW }}
      sendgridApiKey: ${{ secrets.SENDGRID_APIKEY_4E2E_AUTOTESTS }}
      appInsightsInstrumentationKey: ${{ secrets.E2E_APPINSIGHTSINSTRUMENTATIONKEY }}
