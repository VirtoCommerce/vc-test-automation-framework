name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18", current]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
      - run: npm run typecheck
      - run: npm run check:ci
      - run: npm run test:unit
      - run: npm run test:vc:unit
      - run: npm run docs:check
      - run: npm ci --prefix tools/typedoc
      - run: npm run docs:api
      - if: matrix.node == '22.18'
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: api-reference/
          retention-days: 14
      - run: npm run build
      - run: '! grep -rE ''from "@/'' dist'

  changeset:
    if: github.base_ref == 'dev' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm

      - run: npm ci
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
      - run: npx changeset status --since=origin/dev
