# Publishes to npmjs.org with npm Trusted Publishing: npm swaps the GitHub OIDC token for a
# short-lived publish credential and attaches provenance, so no npm token is stored anywhere.
# The trusted publisher on npmjs.com is tied to this repository and this file name, so renaming
# the file breaks publishing, and every publish (release and alpha) has to live in this file.
#
# Triggers:
#   - push to dev                         → changesets: open the release pull request, or publish to latest
#   - push to alpha/**, workflow_dispatch → publish the branch as <version>-alpha.<run number> under alpha

name: Release

on:
  push:
    branches: [dev, "alpha/**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  alpha:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/alpha/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
      - run: npm run typecheck
      - run: npm run check:ci
      - run: npm run test:unit

      - name: Set the alpha version
        run: |
          base=$(node -p "require('./package.json').version")
          npm version "$base-alpha.$GITHUB_RUN_NUMBER" --no-git-tag-version

      - name: Publish under alpha
        run: npm publish --tag alpha

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # No registry-url: it writes an .npmrc with a token placeholder, and trusted
          # publishing needs no token. npmjs.org is the default registry.
          node-version: 22
          cache: npm

      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
      - run: npm run typecheck
      - run: npm run check:ci
      - run: npm run test:unit

      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run release:version
          publish: npm run release:publish
          commit: "chore: release"
          title: "chore: release"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

      - if: steps.changesets.outputs.published == 'true'
        run: npm pack

      - if: steps.changesets.outputs.published == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "@virtocommerce/test-automation-framework@$version" dist.integrity)
          packed="sha512-$(openssl dgst -sha512 -binary ./*.tgz | base64 -w0)"
          echo "published: $published"
          echo "packed:    $packed"
          test "$published" = "$packed"

      - if: steps.changesets.outputs.published == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "*.tgz"
