fragment Cart on CartType {
  id
  storeId
  isAnonymous
  hasPhysicalProducts
  customerId
  itemsCount
  itemsQuantity
  total {
    ...Money
  }
  subTotal {
    ...Money
  }
  subTotalDiscount {
    ...Money
  }
  shippingTotal {
    ...Money
  }
  items {
    ...LineItem
  }
  payments {
    ...Payment
  }
  shipments {
    ...Shipment
  }
  coupons {
    ...Coupon
  }
  gifts {
    ...GiftItem
  }
  addresses {
    ...CartAddress
  }
  validationErrors {
    errorCode
    errorMessage
    errorParameters {
      key
      value
    }
    objectType
    objectId
  }
}
