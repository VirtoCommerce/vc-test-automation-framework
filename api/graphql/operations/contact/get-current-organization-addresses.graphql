query GetCurrentOrganizationAddresses(
  $after: String
  $first: Int
  $countryCodes: [String]
  $regionIds: [String]
  $cities: [String]
  $keyword: String
  $sort: String
) {
  currentOrganizationAddresses(
    after: $after
    first: $first
    countryCodes: $countryCodes
    regionIds: $regionIds
    cities: $cities
    keyword: $keyword
    sort: $sort
  ) {
    totalCount
    items {
      ...MemberAddress
    }
  }
}
