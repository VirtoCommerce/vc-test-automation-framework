query GetPromotionCoupons(
  $storeId: String!
  $userId: String
  $cultureName: String
  $sort: String
  $first: Int
  $after: String
) {
  promotionCoupons(
    storeId: $storeId
    userId: $userId
    cultureName: $cultureName
    sort: $sort
    first: $first
    after: $after
  ) {
    totalCount
    items {
      ...PromotionCoupon
    }
  }
}
